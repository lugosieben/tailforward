name: Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Vet
        run: go vet ./...

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          ext=""
          if [ "$GOOS" = "windows" ]; then ext=".exe"; fi
          go build -trimpath -ldflags "-s -w" -o "tailforward-$GOOS-$GOARCH$ext" ./cmd/tailforward

      - uses: actions/upload-artifact@v4
        with:
          name: tailforward-${{ matrix.goos }}-${{ matrix.goarch }}
          path: tailforward-${{ matrix.goos }}-${{ matrix.goarch }}*
