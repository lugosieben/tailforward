<!DOCTYPE html>
<!--suppress HtmlFormInputWithoutLabel -->
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1" name="viewport">
    <title>tailforward</title>
    <style>
        * {
            box-sizing: border-box
        }

        body {
            font: 14px/1.45 system-ui, sans-serif;
            margin: 0 auto;
            max-width: 560px;
            padding: 16px
        }

        h1 {
            font-size: 18px;
            margin: 0 0 2px
        }

        #status {
            font-size: 13px;
            color: #555;
            margin-bottom: 12px
        }

        #auth {
            display: none;
            background: #fff3d6;
            border: 1px solid #d9b400;
            border-radius: 6px;
            padding: 10px 12px;
            margin-bottom: 12px
        }

        #authBody {
            display: flex;
            gap: 12px;
            align-items: center
        }

        #qr svg {
            display: block;
            width: 128px;
            height: 128px
        }

        #authLink {
            word-break: break-all
        }

        ul {
            list-style: none;
            margin: 0 0 12px;
            padding: 0
        }

        li {
            display: flex;
            gap: 8px;
            align-items: baseline;
            padding: 6px 0;
            border-bottom: 1px solid #eee
        }

        li code {
            flex: 1
        }

        .dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            margin-right: 6px
        }

        /*noinspection CssUnusedSymbol*/
        .dot.on {
            background: #2a2
        }

        /*noinspection CssUnusedSymbol*/
        .dot.off {
            background: #c33
        }

        .err {
            color: #c33;
            font-size: 12px
        }

        form {
            display: flex;
            gap: 6px;
            flex-wrap: wrap
        }

        input {
            padding: 6px 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font: inherit
        }

        input[name=host] {
            flex: 2 1 120px
        }

        input[name=rs], input[name=re], input[name=ls] {
            flex: 1 1 52px;
            min-width: 52px
        }

        button {
            padding: 6px 12px;
            border: 1px solid #ccc;
            background: #f6f6f6;
            border-radius: 4px;
            cursor: pointer;
            font: inherit
        }

        button.primary {
            background: #222;
            color: #fff;
            border-color: #222
        }

        button.small {
            padding: 2px 8px;
            font-size: 12px
        }

        .hint {
            font-size: 12px;
            color: #888
        }

        #keyBox {
            display: none;
            background: #eef4ff;
            border: 1px solid #7aa2f7;
            border-radius: 6px;
            padding: 10px 12px;
            margin-bottom: 12px
        }

        #keyBox p {
            margin: 0 0 8px;
            font-size: 13px
        }

        #keyBox form {
            align-items: center
        }

        #keyBox input[type=password] {
            flex: 1 1 140px;
            min-width: 0
        }

        code {
            background: #f2f2f2;
            padding: 1px 5px;
            border-radius: 3px
        }
    </style>
</head>
<body>
<h1>tailforward</h1>
<div id="status">starting…</div>
<div id="auth"></div>
<div id="keyBox">
    <p id="keyMsg">Settings are encrypted. Enter the key to unlock.</p>
    <form id="keyForm">
        <input id="keyOld" autocomplete="off" name="oldKey" type="password" placeholder="current key" hidden>
        <input id="keyNew" autocomplete="off" name="key" type="password" placeholder="key" required>
        <button class="primary" id="keyGo" type="submit">unlock</button>
        <button class="small" id="keyCancel" type="button" hidden>cancel</button>
    </form>
</div>
<div id="reauthRow" style="display:none;margin-bottom:12px">
    <button class="small" id="reauth">reauth ts</button>
    <button class="small" id="encryptBtn" style="margin-left:8px" hidden>encrypt</button>
    <button class="small" id="changeKeyBtn" style="margin-left:8px" hidden>mod key</button>
    <button class="small" id="removeKeyBtn" style="margin-left:8px" hidden>rm key</button>
    <button class="small" id="lockBtn" style="margin-left:8px" hidden>lock</button>
    <label class="hint" style="margin-left:8px"><input id="ephemeral" type="checkbox" checked>ephemeral</label>
</div>
<ul id="rules"></ul>
<form id="add">
    <input autocomplete="off" list="hosts" name="host" placeholder="device" required>
    <datalist id="hosts"></datalist>
    <input inputmode="numeric" name="rs" placeholder="from" required>
    <input inputmode="numeric" name="re" placeholder="to">
    <input inputmode="numeric" name="ls" placeholder="local" required>
    <button class="primary" id="addBtn">add</button>
    <button type="button" class="small" id="cancelEdit" hidden>cancel</button>
</form>
<p class="hint" id="hint"></p>
<script src="qrcode.min.js"></script>
<script>
    const $ = (id) => document.getElementById(id);
    const statusEl = $("status")
    const authEl = $("auth")
    const rulesEl = $("rules")
    const form = $("add")
    const hostsEl = $("hosts")
    const hintEl = $("hint")
    const reauthRow = $("reauthRow")
    const reauthBtn = $("reauth");
    const ephemeralBox = $("ephemeral");
    const addBtn = $("addBtn");
    const cancelEditBtn = $("cancelEdit");
    const keyBox = $("keyBox");
    const keyMsg = $("keyMsg");
    const keyForm = $("keyForm");
    const keyOld = $("keyOld");
    const keyNew = $("keyNew");
    const keyGo = $("keyGo");
    const keyCancel = $("keyCancel");
    const lockBtn = $("lockBtn");
    let keyMode = null; // unlock set change remove
    const encryptBtn = $("encryptBtn");
    const changeKeyBtn = $("changeKeyBtn");
    const removeKeyBtn = $("removeKeyBtn");
    let lastAuth = null
    let lastFrom = "";
    let lastDevices = "";
    let lastRules = [];
    let editing = null;
    let modeBusy = false;

    const api = async (path, body) => {
        const r = await fetch(path, body ? {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify(body)
        } : {});
        if (!r.ok) throw new Error(await r.text());
        return r.json();
    };
    const esc = (s) => String(s)
        .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");

    function renderAuth(url) {
        if (url === lastAuth) return;
        lastAuth = url;
        if (!url) {
            authEl.style.display = "none";
            authEl.innerHTML = "";
            return;
        }
        authEl.style.display = "block";
        let qr;
        try {
            // noinspection JSUnresolvedReference
            const c = qrcode(0, "M");
            c.addData(url);
            c.make();
            qr = c.createSvgTag({scalable: true});
        } catch {
            qr = "QR unavailable";
        }
        authEl.innerHTML = `<div id="authBody"><div id="qr">${qr}</div><div>Scan or open:<br><a id="authLink" href="${esc(url)}" target="_blank" rel="noopener">${esc(url)}</a></div></div>`;
    }

    function renderAuthState(s) {
        if (s.authURL) {
            renderAuth(s.authURL);
        } else if (s.status === "login needed") {
            renderAuth("");
            authEl.style.display = "block";
            authEl.textContent = "Waiting for the login link…";
        } else if (s.status === "approval needed") {
            renderAuth("");
            authEl.style.display = "block";
            authEl.textContent = "Waiting for approval in the Tailscale admin console…";
        } else {
            renderAuth("");
        }
    }

    const lastDevicesMap = new Map();

    function dotFor(host) {
        const online = lastDevicesMap.get(host);
        if (online === undefined) return "";
        return `<span class="dot ${online ? "on" : "off"}" title="device ${online ? "online" : "offline"}"></span>`;
    }

    async function refresh() {
        try {
            const s = await api("/api/state");
            statusEl.textContent = "tailnet: " + s.status;
            if (s.locked) {
                if (keyMode !== "unlock") openKeyDialog("unlock");
            } else if (keyMode === "unlock") {
                keyBox.style.display = "none";
                keyMode = null;
            }
            const unlocked = !s.locked;
            reauthRow.style.display = unlocked && !/^(starting|connecting)/.test(s.status) ? "block" : "none";
            lockBtn.hidden = !s.encrypted;
            encryptBtn.hidden = s.encrypted;
            changeKeyBtn.hidden = !s.encrypted;
            removeKeyBtn.hidden = !s.encrypted;
            if (!modeBusy) ephemeralBox.checked = s.ephemeral !== false;
            reauthBtn.textContent = ephemeralBox.checked ? "reauth ts" : "logout ts";
            renderAuthState(s);
            const names = (s.devices || []).map(d => d.name).join("\u0000");
            if (names !== lastDevices) {
                lastDevices = names;
                hostsEl.innerHTML = (s.devices || []).map(d => `<option value="${esc(d.name)}">`).join("");
            }
            lastRules = s.rules || [];
            lastDevicesMap.clear();
            for (const d of s.devices || []) lastDevicesMap.set(d.name, d.online);
            rulesEl.innerHTML = lastRules.map(r =>
                `<li><code>${dotFor(r.host)}${esc(r.label)}${r.total > 1 ? ` <span class="hint">${r.active}/${r.total}</span>` : ""}</code>` +
                (r.error ? `<span class="err">${esc(r.error)}</span>` : "") +
                `<button class="small" data-ls="${r.localStart}" data-act="edit">edit</button> ` +
                `<button class="small" data-ls="${r.localStart}" data-act="del">del</button></li>`).join("");
        } catch (e) {
            statusEl.textContent = "UI error: " + e;
        }
    }

    rulesEl.onclick = async (e) => {
        const btn = e.target.closest("button[data-ls]");
        if (!btn) return;
        const ls = +btn.dataset.ls;
        if (btn.dataset.act === "edit") {
            const r = lastRules.find(x => x.localStart === ls);
            if (r) startEdit(r);
            return;
        }
        try {
            await api("/api/rules", {action: "delete", localStart: ls});
        } catch (err) {
            alert(err.message);
        }
        if (editing === ls) endEdit();
        await refresh();
    };

    function startEdit(r) {
        editing = r.localStart;
        form.host.value = r.host;
        form.rs.value = r.remoteStart;
        form.re.value = r.remoteEnd;
        form.ls.value = r.localStart;
        lastFrom = String(r.remoteStart);
        addBtn.textContent = "update";
        cancelEditBtn.hidden = false;
        hint();
        form.host.focus();
    }

    function endEdit() {
        editing = null;
        form.reset();
        lastFrom = "";
        addBtn.textContent = "add";
        cancelEditBtn.hidden = true;
        hint();
    }

    cancelEditBtn.onclick = () => {
        if (editing !== null) endEdit();
    };

    function hint() {
        const rs = +form.rs.value, re = +form.re.value || rs, ls = +form.ls.value;
        hintEl.textContent = rs >= 1 && re >= rs && ls >= 1
            ? "→ localhost:" + ls + (re > rs ? "-" + (ls + re - rs) : "")
            : "";
    }

    form.rs.addEventListener("input", () => {
        const v = form.rs.value.trim();
        if (v && v !== lastFrom) {
            if (!form.re.value || form.re.value === lastFrom) form.re.value = v;
            if (!form.ls.value || form.ls.value === lastFrom) form.ls.value = v;
        }
        lastFrom = v;
        hint();
    });
    form.re.addEventListener("input", hint);
    form.ls.addEventListener("input", hint);

    form.onsubmit = async (e) => {
        e.preventDefault();
        const rs = +form.rs.value, re = +form.re.value || rs;
        const body = {
            action: editing !== null ? "update" : "add",
            host: form.host.value.trim(),
            remoteStart: rs,
            remoteEnd: re,
            localStart: +form.ls.value
        };
        if (editing !== null) body.oldLocalStart = editing;
        try {
            await api("/api/rules", body);
            endEdit();
            await refresh();
        } catch (err) {
            alert(err.message);
        }
    };

    form.onreset = () => { if (editing !== null) endEdit(); };

    reauthBtn.onclick = async () => {
        if (!ephemeralBox.checked && !confirm("Log out? This will not remove the device from your tailnet")) return;
        reauthBtn.disabled = true;
        try {
            await api("/api/reauth", {});
            await refresh();
        } catch (err) {
            /already in progress/.test(err.message) ? await refresh() : alert(err.message);
        } finally {
            reauthBtn.disabled = false;
        }
    };

    ephemeralBox.onchange = async () => {
        const want = ephemeralBox.checked;
        if (!confirm(want
            ? "Are you sure you want to switch to ephemeral? This logs you out immediately"
            : "Are you sure you want to switch to persistent? This logs you out immediately")) {
            ephemeralBox.checked = !want;
            return;
        }
        modeBusy = true;
        ephemeralBox.disabled = true;
        try {
            await api("/api/mode", {ephemeral: want});
            await refresh();
        } catch (err) {
            ephemeralBox.checked = !want;
            alert(err.message);
        } finally {
            ephemeralBox.disabled = false;
            modeBusy = false;
        }
    };

    const keyDialogs = {
        unlock: {msg: "Settings are encrypted.", old: false, go: "unlock"},
        set: {msg: "Choose an encryption key.", old: false, go: "encrypt"},
        change: {msg: "Enter the current key and the new key.", old: true, go: "change"},
        remove: {msg: "Enter the key to remove encryption. Everything is stored in plaintext again.", old: false, go: "remove"}
    };

    function openKeyDialog(mode) {
        const d = keyDialogs[mode];
        keyMode = mode;
        keyMsg.textContent = d.msg;
        keyOld.hidden = !d.old;
        keyOld.required = d.old;
        keyOld.value = "";
        keyNew.value = "";
        keyGo.textContent = d.go;
        keyCancel.hidden = mode === "unlock";
        keyBox.style.display = "block";
        (d.old ? keyOld : keyNew).focus();
    }

    keyForm.onsubmit = async (e) => {
        e.preventDefault();
        const body = {action: keyMode, key: keyNew.value};
        if (keyMode === "change") body.oldKey = keyOld.value;
        keyGo.disabled = true;
        try {
            await api("/api/key", body);
            keyForm.reset();
            keyBox.style.display = "none";
            keyMode = null;
            await refresh();
        } catch (err) {
            alert(err.message);
        } finally {
            keyGo.disabled = false;
        }
    };

    keyCancel.onclick = () => {
        keyForm.reset();
        keyBox.style.display = "none";
        keyMode = null;
    };

    lockBtn.onclick = async () => {
        lockBtn.disabled = true;
        try {
            await api("/api/key", {action: "lock"});
            await refresh();
        } catch (err) {
            alert(err.message);
        } finally {
            lockBtn.disabled = false;
        }
    };

    encryptBtn.onclick = () => openKeyDialog("set");
    changeKeyBtn.onclick = () => openKeyDialog("change");
    removeKeyBtn.onclick = () => openKeyDialog("remove");

    refresh();
    setInterval(refresh, 2000);
</script>
</body>
</html>
